# Fly.io: fly launch --copy-config --no-deploy  (pick a unique app name), then fly deploy
app = "browserzombies-relay"
primary_region = "fra"

[build]

[env]
  PORT = "8090"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
